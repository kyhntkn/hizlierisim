name: Build EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish portable EXE (no runtime needed)
        run: >
          dotnet publish HizliErisim.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/portable

      - name: Publish small EXE (needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish HizliErisim.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -o out/small

      - name: Rename outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item out/portable/HizliErisim.exe dist/HizliErisim-portable.exe
          Copy-Item out/small/HizliErisim.exe dist/HizliErisim-small.exe

      - uses: actions/upload-artifact@v4
        with:
          name: HizliErisim
          path: dist/*.exe

      - name: Create release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
